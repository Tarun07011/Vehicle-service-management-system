<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  body { font-family: Helvetica, Arial, sans-serif; color: #1f2937; font-size: 12px; }
  .company-name { font-size: 20px; font-weight: bold; color: #12263f; }
  .company-name span { color: #2563eb; }
  .muted { color: #6b7280; font-size: 11px; margin-bottom: 16px; }
  h2 { font-size: 15px; color: #12263f; margin: 14px 0 10px; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #f8fafc; text-align: left; padding: 8px; font-size: 11px; color: #6b7280; border-bottom: 1px solid #e2e8f0; }
  td { padding: 8px; border-bottom: 1px solid #e2e8f0; font-size: 11px; }
  .footer { margin-top: 24px; font-size: 10px; color: #6b7280; text-align: center; }
</style>
</head>
<body>

  <div class="company-name">Auto<span>Care</span></div>
  <div class="muted">Vehicle Service Management</div>

  <h2>{{ title }}</h2>

  <table>
    <tr>
      {% for col in columns %}
      <th>{{ col }}</th>
      {% endfor %}
    </tr>
    {% for row in rows %}
    <tr>
      {% for cell in row %}
      <td>{{ cell }}</td>
      {% endfor %}
    </tr>
    {% else %}
    <tr><td colspan="{{ columns|length }}">No records found.</td></tr>
    {% endfor %}
  </table>

  <div class="footer">Generated by AutoCare Vehicle Service Management</div>

</body>
</html>
